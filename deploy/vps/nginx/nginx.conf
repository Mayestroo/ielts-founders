worker_processes 6;
worker_rlimit_nofile 65536;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Optimization: Disable access logs for performance if needed, or keep for debugging
  # access_log off; 
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # User-requested Gzip Optimizations
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # Global limits
  client_max_body_size 210M; # Matching ielts.conf requirement

  # Include site configurations (e.g., ielts.conf)
  include /etc/nginx/conf.d/*.conf;
}
